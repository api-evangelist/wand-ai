apis:
- aid: wand-ai:status-api
  name: Wand Status API
  image: https://wand.ai/hubfs/logo.png
  description: >-
    A public, unauthenticated JSON API served by the Wand platform status page. It reports overall
    platform health, the four Wand products and the twenty-two production services behind them, plus
    thirty-day uptime series. Observed live and undocumented — Wand publishes no reference page or
    machine-readable contract for it; the endpoints below were established by probe on 2026-09-04.
  humanURL: https://status.wand.ai/
  baseURL: https://status.wand.ai
  tags:
  - Status
  - Monitoring
  - Uptime
  - Observability
  properties:
  - type: StatusPage
    url: https://status.wand.ai/
  - type: Lifecycle
    url: lifecycle/wand-ai-lifecycle.yml
- aid: wand-ai:identity
  name: Wand Identity (OpenID Connect)
  image: https://wand.ai/hubfs/logo.png
  description: >-
    Wand runs Keycloak at auth.wand.ai as the identity provider for its platform. The master realm
    serves an anonymous OpenID Connect discovery document declaring the authorization, token,
    userinfo, introspection, revocation, device-authorization and JWKS endpoints, the supported
    grant types and response modes, and the supported scopes. Client registration and every token
    endpoint require credentials; only the discovery metadata and JWKS are public.
  humanURL: https://auth.wand.ai/realms/master/.well-known/openid-configuration
  baseURL: https://auth.wand.ai/realms/master
  tags:
  - Authentication
  - Identity
  - OpenID Connect
  - SSO
  tags_raw:
  - Authentication
  - Identity
  - OpenID Connect
  - OAuth
  - SSO
  properties:
  - type: OpenIDConnect
    url: well-known/wand-ai-openid-configuration.json
  - type: Authentication
    url: authentication/wand-ai-authentication.yml
  - type: OAuthScopes
    url: scopes/wand-ai-scopes.yml
- aid: wand-ai:ai-workforce-api
  name: Wand AI Workforce API
  image: https://wand.ai/hubfs/logo.png
  description: >-
    The platform API behind Wand's Process Agentizer product, named "AI Workforce API" in Wand's own
    machine-readable status feed at https://status.wand.ai/api/services. The host api.wand.ai
    resolves inside Wand's Cloudflare zone and serves Wand's security.txt, but every probed path
    returned an HTTP 503 from a Google front end on 2026-09-04 and Wand publishes no developer
    portal, API reference, OpenAPI, SDK or pricing for it. Recorded as a real but sales-gated and
    undocumented surface; no contract has been captured and none has been authored.
  humanURL: https://wand.ai/product-page
  baseURL: https://api.wand.ai
  tags:
  - AI Agents
  - Workforce Automation
  - Orchestration
  - Task Management
  - Messaging
  properties:
  - type: StatusPage
    url: https://status.wand.ai/
  - type: Lifecycle
    url: lifecycle/wand-ai-lifecycle.yml
  - type: Authentication
    url: authentication/wand-ai-authentication.yml

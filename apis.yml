aid: wand-ai
name: Wand
description: >-
  Wand (Wand Synthesis AI, Inc.) is a Palo Alto, California enterprise software company, founded in
  2022 by Rotem Alaluf, that builds what it calls agentic labor infrastructure — an operating system
  for hybrid workforces in which AI agents are managed, executed and created as trusted team members
  alongside human employees. Its four published product areas are Process Agentizer (workforce
  automation, messaging and task orchestration), Collab (collaboration, chat and content ingestion),
  Governance (organization management and metrics) and Integration Hub (economy, billing and
  knowledge-vault integrations), offered on-premise, in a private cloud, or hosted. Wand publishes
  no developer portal, API reference or machine-readable contract; its platform API — named "AI
  Workforce API" in its own status feed — sits behind an enterprise sales gate at api.wand.ai. The
  public surfaces reached here are a JSON status API, a Keycloak OpenID Connect discovery document,
  a security.txt, and an llms.txt.

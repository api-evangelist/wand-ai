  reason: covered
  detail: >-
    Wand publishes no developer portal, API reference or machine-readable contract — its platform
    "AI Workforce API" sits behind an enterprise demo-booking gate at api.wand.ai, which returned
    HTTP 503 on every probed path — but four real first-party surfaces were found and captured: an
    llms.txt, an RFC 9116 security.txt served across its subdomains, a Keycloak OpenID Connect
    discovery document, and an unauthenticated JSON status API exposing 4 products and 22 services.
  evidence:

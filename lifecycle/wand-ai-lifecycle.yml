versioning:
  policy_published: false
  scheme: unknown
  note: >-
    No versioning policy is published. The only version signal visible anywhere is the service name
    "Executor Service V2" on the status page, which is an internal service generation, not an API
    version an integrator can pin.
deprecation:
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  rfc8594: false
  note: >-
    No deprecation policy, no Sunset/Deprecation header documentation, and no deprecated-operations
    list — there is no public contract in which operations could be marked deprecated.
changelog:

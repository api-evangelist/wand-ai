generated: '2026-09-04'
method: probed
source: >-
  https://status.wand.ai/ and its JSON endpoints /api/status, /api/services, /api/products,
  /api/uptime and /api/health, all fetched anonymously on 2026-09-04.
name: Wand lifecycle, status and versioning
description: >-
  Wand runs a first-party status page at status.wand.ai — a self-hosted Next.js page backed by
  Grafana, not a Statuspage.io/Instatus tenant — and it exposes an unauthenticated JSON API that is
  the single richest machine-readable thing Wand publishes. Everything else in the lifecycle
  dimension is absent: no changelog, no release notes, no versioning policy, no deprecation or
  Sunset-header policy, and no SLA.
status_page:
  present: true
  url: https://status.wand.ai/
  http_status: 200
  platform: self-hosted (Next.js front end, Grafana data source)
  data_source: grafana
  cluster: wand-prod
  view: prod
  services_monitored: 22
  products_monitored: 4
  uptime_window: 30d
  observed_30d_uptime_percent: 99.7
  observed_global_status: some_issues
  observed_at: '2026-09-04T22:30:44Z'
  machine_readable: true
  api:
    base: https://status.wand.ai
    auth: none
    endpoints:
    - path: /api/status
      method: GET
      status: 200
      content_type: application/json
      returns: >-
        globalStatus, globalMessage, overallUptimePercent, activeIncidents, scheduledMaintenance,
        lastUpdated, dataSource, domain, view, cluster, servicesMonitored, productsMonitored
    - path: /api/products
      method: GET
      status: 200
      content_type: application/json
      returns: products[] with id, name, description, status, uptimePercent and nested services[]
    - path: /api/services
      method: GET
      status: 200
      content_type: application/json
      returns: services[] with id, name, productId, productName, description and status
    - path: /api/uptime
      method: GET
      status: 200
      content_type: application/json
      returns: 'uptime[] per serviceId with period, overallPercent and a days[] series'
    - path: /api/health
      method: GET
      status: 200
      content_type: application/json
      returns: '{"status":"ok"}'
    absent:
    - path: /api/incidents
      status: 404
    - path: /api/components
      status: 404
    - path: /api/summary
      status: 404
    - path: /openapi.json
      status: 404
    note: >-
      Undocumented. Wand publishes no reference page or contract for these endpoints; they were
      established by probe. No RSS or Atom feed and no subscribe/webhook surface was found.

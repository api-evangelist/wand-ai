name: Wand rate limits
description: >-
  No rate limits are documented and none are signalled at runtime. Neither of the two public Wand
  HTTP surfaces returns any RateLimit-*, X-RateLimit-* or Retry-After header, and there is no
  developer documentation in which a limit could be published. An agent calling Wand has no way to
  learn its budget before it is cut off.
